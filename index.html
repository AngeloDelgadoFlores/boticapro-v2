create table almacenes (
  id uuid primary key default gen_random_uuid(),
  nombre text not null,
  tipo text check (tipo in ('central','tienda')) not null,
  estado text default 'activo'
);
-- CATEGORIAS
create table categorias (
  id uuid primary key default gen_random_uuid(),
  nombre text not null unique
);
-- PRODUCTOS
create table productos (
  id uuid primary key default gen_random_uuid(),
  nombre text not null,
  categoria text,
  categoria_id uuid references categorias(id),
  laboratorio text,
  precio_compra numeric default 0,
  precio_venta numeric default 0,
  stock_minimo int default 5,
  estado text default 'activo'
);
-- LOTES
create table lotes (
  id uuid primary key default gen_random_uuid(),
  producto_id uuid references productos(id) on delete cascade,
  almacen_id uuid references almacenes(id),
  lote text not null,
  cantidad int not null default 0,
  vencimiento date not null,
  tipo_ingreso text,
  costo numeric default 0,
  observacion text,
  estado text default 'activo'
);
-- MOVIMIENTOS
create table movimientos (
  id uuid primary key default gen_random_uuid(),
  tipo text not null,
  producto_id uuid references productos(id),
  lote text,
  cantidad int not null,
  origen_almacen uuid references almacenes(id),
  destino_almacen uuid references almacenes(id),
  usuario text,
  motivo text,
  created_at timestamptz default now()
);
-- TRANSFERENCIAS (opcional)
create table transferencias (
  id uuid primary key default gen_random_uuid(),
  origen_almacen uuid references almacenes(id),
  destino_almacen uuid references almacenes(id),
  producto_id uuid references productos(id),
  lote text,
  cantidad int,
  usuario text,
  motivo text,
